  <g id="TECH" fill="url(#aplGradient)"
     font-family="Montserrat, Arial, Helvetica, sans-serif"
     font-size="43" font-weight="600" letter-spacing="18">
    <text x="113" y="274">TECH</text>
  </g>
</svg>
