<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300">
  <defs>
    <linearGradient id="aplGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6E2382"/>
      <stop offset="50%" stop-color="#76218A"/>
      <stop offset="100%" stop-color="#92168E"/>
    </linearGradient>
  </defs>

  <!-- APL TECH logo — fully editable vector -->
  <g id="APL-symbol" fill="url(#aplGradient)">
